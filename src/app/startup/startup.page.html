<ion-content [fullscreen]="true" class="startup-content">
  <div class="startup-loading ion-padding">
    <div class="startup-panel">
      <p class="startup-brand">TKKS</p>
      <ion-spinner name="crescent"></ion-spinner>
      <h1>Checking device</h1>
      <p class="startup-message">
        {{ isOnline ? 'Preparing your assigned workspace...' : 'Waiting for internet connection...' }}
      </p>
    </div>
  </div>
</ion-content>
